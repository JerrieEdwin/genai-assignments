<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeployLens Comparison</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .review-shell { min-height:100vh; display:grid; grid-template-columns:280px minmax(0,1fr); }
    .sidebar { background:#fff; border-right:1px solid var(--line); padding:16px; }
    .review-main { padding:20px; min-width:0; }
    .toolbar { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; }
    .toolbar label { width:170px; margin:0; }
    .toolbar input { width:100%; }
    .route-list { list-style:none; padding:0; margin:12px 0; }
    .route-list button { width:100%; text-align:left; margin:3px 0; background:#fff; border:1px solid var(--line); color:var(--ink); }
    .route-list button.active { border-color:var(--blue); background:var(--blue-soft); }
    .badge { display:inline-block; border-radius:999px; padding:3px 7px; font-size:11px; margin-left:5px; }
    .changed { background:#fee4e2; color:#912018; }
    .unchanged { background:#dcfae6; color:#05603a; }
    .incompatible { background:#fef0c7; color:#93370d; }
    .empty { color:var(--muted); padding:20px 0; }
    .context-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
    .context-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; }
    .context-card h3 { font-size:11px; color:var(--muted); margin:0 0 5px; text-transform:uppercase; letter-spacing:.04em; }
    .context-card p { margin:0; font-size:13px; white-space:pre-wrap; }
    .viewer { background:#111827; border-radius:12px; padding:12px; overflow:auto; }
    .view-tabs { display:flex; gap:6px; margin-bottom:10px; }
    .view-tabs button { background:#374151; color:#fff; }
    .view-tabs button.active { background:var(--blue); }
    .canvas-wrap { position:relative; width:max-content; max-width:100%; margin:auto; }
    #comparison-canvas { display:block; max-width:100%; height:auto; background:#fff; }
    .view-actions { display:flex; gap:8px; margin-top:10px; }
    .view-actions button { background:#fff; color:var(--ink); border:1px solid var(--line); }
  </style>
</head>
<body>
  <div class="review-shell">
    <aside class="sidebar">
      <div class="brand" style="padding:0 0 12px">
        <div class="brand-mark"></div>
        <div><h1>DeployLens</h1><p>Captured routes</p></div>
      </div>
      <label>Baseline <select id="baseline-select"></select></label>
      <label>Current <select id="current-select"></select></label>
      <div id="release-summary" class="context-card" style="margin:12px 0"></div>
      <button id="compare-all" class="primary" style="font-size:12px">Compare all routes</button>
      <button id="export-all-json" class="secondary" style="font-size:12px;margin-top:7px">Export all-route report</button>
      <ul id="route-list" class="route-list" aria-label="Route comparisons"></ul>
    </aside>
    <main class="review-main">
      <div class="toolbar">
        <label>Difference threshold % <input id="threshold" type="number" min="0" max="100" step="0.1" value="1"></label>
        <label>Pixel tolerance <input id="pixel-tolerance" type="number" min="0" max="255" value="25"></label>
        <label>Ignore query params <input id="ignore-query" placeholder="utm_source, preview"></label>
        <label>Query matching
          <select id="query-mode"><option value="preserve">Preserve/sort</option><option value="ignore">Ignore all</option></select>
        </label>
        <button id="apply-settings" class="primary" style="width:auto">Apply</button>
      </div>
      <div id="detail">
        <p class="empty">Select baseline and current releases to compare captured routes.</p>
      </div>
    </main>
  </div>
  <script src="lib/route.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/diff.js"></script>
  <script src="review.js"></script>
</body>
</html>
